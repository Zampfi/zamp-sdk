name: zizmor

# Stub. Configures nothing: the policy lives in Zampfi/.github and applies
# org-wide, so tightening or relaxing the gate is an edit to one file there.
#
# Do not rename the `zizmor` job: the required check is "zizmor / scan", i.e.
# <caller job id> / <called job name>, and rulesets require that exact string.
#
# Do not add `permissions: {}` here -- the called workflow grants what it uses,
# and an empty block on the caller makes the run fail before it starts.
#
# Do not add a `paths:` filter: a required check that is skipped never reports,
# so PRs that do not touch .github/ would be unable to merge.

on:
  pull_request:

jobs:
  zizmor:
    uses: Zampfi/.github/.github/workflows/zizmor-scan.yml@v1

name: Bump Version and Tag

on:
  push:
    branches:
      - main
    paths:
      - "zamp_sdk/**"
      - "pyproject.toml"

env:
  ORG: Zampfi
  TARGET_REPO: zamp-sdk
  PYTHON_VERSION: "3.12"

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.author.name != 'zampactionbot[bot]' }}
    # BOT_APP_* live in the main-only `release` environment, not repo secrets: the
    # app bypasses the main ruleset, so its key must not reach other branches' workflows.
    environment: release
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ env.ORG }}
          repositories: ${{ env.TARGET_REPO }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Resolve release version
        id: bump
        run: |
          CURRENT=$(poetry version -s)
          if git rev-parse -q --verify "refs/tags/$CURRENT" >/dev/null; then
            # Current version is already released — auto patch-bump to the next one.
            poetry version patch
            NEW_VERSION=$(poetry version -s)
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "Patch-bumped $CURRENT -> $NEW_VERSION"
          else
            # pyproject holds an as-yet-unreleased version (e.g. a manual bump in the
            # merged PR) — release it verbatim instead of bumping past it.
            NEW_VERSION=$CURRENT
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "Releasing pyproject version as-is: $NEW_VERSION"
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "224820880+zampactionbot[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git add pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git push

      - name: Create and push tag
        id: tag
        run: |
          git tag "${{ steps.bump.outputs.new_version }}"
          git push origin "${{ steps.bump.outputs.new_version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Publishing lives here, not in a workflow_run listener: workflow_run matches the
  # triggering workflow by name only, so a same-named workflow in a fork PR could
  # fire it with the PyPI token. Building the tagged sha (not workflow_run.head_sha)
  # also ships the bot's bump commit when the version was auto-bumped.
  # Uploads use PyPI trusted publishing: PyPI trusts this workflow file in the
  # `pypi` environment (deployable from main only), so no API token is stored.
  pypi-publish:
    name: Publish to PyPI
    needs: bump-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      - run: poetry build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
